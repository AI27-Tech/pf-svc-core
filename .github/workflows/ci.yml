# CI de pf-svc-core (raíz de composición, DEC-050). Ramas de repo-convention.
#
# Los repos AI27-Tech/* son privados, así que resolver módulos exige un token
# con lectura de pf-pkg-contracts y pf-pkg-platform-go. Se inyecta por el secreto
# de repo GH_PAT (un PAT; el GITHUB_TOKEN por defecto no lee otros repos
# privados). GOPRIVATE evita que go valide estos módulos contra sum.golang.org.
name: ci

on:
  push:
    branches: [pf-core-m, pf-core-d, pf-core-q]
  pull_request:
    branches: [pf-core-m, pf-core-d, pf-core-q]

permissions:
  contents: read

env:
  GOPRIVATE: github.com/AI27-Tech/*

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      # Pruebas de integración (internal/pgtest): Postgres dedicado a pruebas, auth
      # trust y superusuario sin contraseña. La bandera declara el cluster desechable.
      CORE_TEST_PG_ADMIN_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      CORE_TEST_PG_DESECHABLE: "1"
      NATS_URL: nats://127.0.0.1:4222
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Verificar que el secreto GH_PAT existe
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "ERROR: falta el secreto de repo GH_PAT (PAT con lectura de los repos privados AI27-Tech/*)."
            echo "Config: Settings -> Secrets and variables -> Actions -> New repository secret -> GH_PAT"
            exit 1
          fi

      - name: Configurar acceso a módulos privados
        run: git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Descargar dependencias
        run: go mod download

      # Sin Postgres las pruebas de integración se saltarían en silencio: aquí
      # el job falla si no responde.
      - name: Verificar que Postgres responde
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done
          psql "$CORE_TEST_PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c 'select 1'

      # El servicio de NATS no admite argumentos (-js), así que va con docker run.
      - name: Levantar NATS JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine -js
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null && exit 0
            sleep 1
          done
          echo "ERROR: NATS no responde en 127.0.0.1:4222"; docker logs nats; exit 1

      # 1. Build y vet de producción (sin devauth), versiones exactas de go.mod.
      - name: Build (producción)
        run: go build ./...
      - name: Vet
        run: go vet ./...

      # 2. Tests, incluidas las pruebas de arranque/drenado y de adaptadores (I3)
      #    cuando existan módulos cableados.
      #    -p 1: pgtest resetea la configuración de roles del cluster, así que dos
      #    paquetes con Postgres no pueden correr a la vez.
      - name: Test
        run: go test -count=1 -p 1 ./...

      # 3. El stub de desarrollo compila con su tag.
      - name: Build con -tags devauth
        run: go build -tags devauth ./...
      - name: Test con -tags devauth
        run: |
          go test -count=1 -p 1 -v -tags devauth ./... | tee test-devauth.log
          # El humo y cmd/migrate deben CORRER, no saltarse.
          if grep -q -- '--- SKIP' test-devauth.log; then
            echo "ERROR: hay pruebas saltadas"; grep -- '--- SKIP' test-devauth.log; exit 1
          fi
          for t in TestHumoSolicitudHastaViajeAprobadoYConversacion TestMigrateDosVecesYLlegaLoNuevo; do
            grep -q -- "--- PASS: $t " test-devauth.log || { echo "ERROR: $t no corrió o no pasó"; exit 1; }
          done

      # bus_test.go (build tag nats) contra NATS JetStream real.
      - name: Test con -tags nats
        run: |
          go test -count=1 -v -tags nats ./cmd/core | tee test-nats.log
          grep -q -- '--- PASS: TestAbrirBusConectaYCierra' test-nats.log

      # 4. Compuerta anti-stub: el binario de producción NO contiene internal/devauth.
      - name: El binario de producción no contiene devauth
        run: |
          if go list -deps ./cmd/core | grep -q 'pf-svc-core/internal/devauth'; then
            echo "ERROR: el build de producción incluye internal/devauth"
            exit 1
          fi
          echo "OK: devauth ausente del build de producción"

  arch-test:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/AI27-Tech/*
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Verificar que el secreto GH_PAT existe
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "ERROR: falta el secreto de repo GH_PAT."
            exit 1
          fi
      - name: Configurar acceso a módulos privados
        run: git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
      # 5. pf-svc-core es el ÚNICO repo autorizado a requerir otros pf-svc-* y
      #    solo cablea aristas declaradas (00 regla 5). La versión del tool se
      #    fija a la misma de platform-go en go.mod.
      - name: arch-test
        run: go run github.com/AI27-Tech/pf-pkg-platform-go/tools/arch-test@v0.1.10 .

  docker:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verificar que el secreto GH_PAT existe
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "ERROR: falta el secreto de repo GH_PAT."
            exit 1
          fi
      # 6. Imagen de core con la plantilla de pf-pkg-platform-go, CMD_PATH=./cmd/core.
      #    La imagen NUNCA se construye con -tags devauth.
      - name: Obtener la plantilla de Dockerfile
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          # La plantilla vive en pf-pkg-platform-go/templates/Dockerfile (v0.1.0).
          git clone --depth 1 --branch v0.1.0 https://github.com/AI27-Tech/pf-pkg-platform-go /tmp/platform-go
          cp /tmp/platform-go/templates/Dockerfile ./Dockerfile
      - name: Build de la imagen core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            CMD_PATH=./cmd/core
          secrets: |
            gh_token=${{ secrets.GH_PAT }}
